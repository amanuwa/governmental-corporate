<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Registration - Secure Gateway</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Security Header -->
    <header class="border-b border-gray-200 bg-white px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-600 animate-pulse"></span>
            <span class="text-cyan-700 font-mono text-xs tracking-wider">// SECURE INSTITUTIONAL REGISTRATION PORTAL</span>
        </div>
        <div class="text-xs font-mono text-gray-500">ENCRYPTION: AES-256-GCM</div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white border border-gray-200 rounded-xl p-8 shadow-xl relative overflow-hidden">
            <!-- Decorative Security Accent Line -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600"></div>

            <div class="mb-8 text-center">
                <h1 class="text-xl font-mono font-bold text-gray-900 tracking-tight">Create Corporate Profile</h1>
                <p class="text-xs font-mono text-gray-500 mt-1">Authorized Governmental & Corporate Personnel Only</p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-5 font-mono text-xs">
                <!-- Username -->
                <div>
                    <label class="block text-gray-700 mb-1.5 uppercase tracking-wider text-[10px]">Username / Operator ID</label>
                    <input type="text" id="username" required placeholder="e.g. amanuel.bekele" 
                        class="w-full bg-gray-50 border border-gray-300 rounded px-3.5 py-2.5 text-gray-900 focus:outline-none focus:border-cyan-600 transition">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-gray-700 mb-1.5 uppercase tracking-wider text-[10px]">Institutional Email</label>
                    <input type="email" id="email" required placeholder="name@gov-corporate.org" 
                        class="w-full bg-gray-50 border border-gray-300 rounded px-3.5 py-2.5 text-gray-900 focus:outline-none focus:border-cyan-600 transition">
                </div>

                <!-- Governmental Corporate / Organization -->
                <div>
                    <label class="block text-gray-700 mb-1.5 uppercase tracking-wider text-[10px]">Governmental Corporate / Agency</label>
                    <select id="corporation" required class="w-full bg-gray-50 border border-gray-300 rounded px-3.5 py-2.5 text-gray-900 focus:outline-none focus:border-cyan-600 transition">
                        <option value="" disabled selected>Addis Abeba woreda 1</option>
                        <option value="Dan Energy Ethiopia">benishangul zone 1</option>
                        <option value="Federal Ministry of Innovation & Technology">Amhara region woreda 1</option>
                        <option value="National Media & Broadcasting Authority">oromia  region Agriculture office  </option>
                        <option value="State Press & Editorial Bureau">Amhara region revenue  Bureau</option>
                        <option value="Other Authorized Corporate Entity">Other Authorized Corporate Entity</option>
                    </select>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-gray-700 mb-1.5 uppercase tracking-wider text-[10px]">Secure Password</label>
                    <input type="password" id="password" required placeholder="••••••••••••" 
                        class="w-full bg-gray-50 border border-gray-300 rounded px-3.5 py-2.5 text-gray-900 focus:outline-none focus:border-cyan-600 transition">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded tracking-wider uppercase transition shadow-md shadow-cyan-600/20 mt-2">
                    Initialize Secure Registration
                </button>
            </form>

            <div class="mt-6 text-center border-t border-gray-200 pt-4 font-mono text-xs">
                <span class="text-gray-500">Already cleared security clearance?</span> 
                <a href="index.html" class="text-cyan-600 hover:underline ml-1">Sign In</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 bg-white py-4 text-center text-gray-500 font-mono text-xs shadow-sm">
        // Journalist Preparation Studio &copy; 2026 - Institutional Security Division
    </footer>
        <script src="session-timeout.js"></script>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const corporation = document.getElementById('corporation').value;
            
            localStorage.setItem('studioUser', JSON.stringify({ username, email, corporation }));
            
            alert("Registration successful. Routing to Secure Dashboard...");
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
